<style>

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}

.brand{font:700 1.15rem var(--fd);white-space:nowrap}

.m{color:var(--mu);font-size:.88rem;margin-bottom:12px}.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--s2);color:var(--ac);font-size:.78rem;font-weight:700;margin-bottom:8px}
.tw{overflow-x:auto}.gt{border-collapse:collapse;width:100%;min-width:540px;font-size:.88rem}.gt th,.gt td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}.gt th{color:var(--tx);white-space:nowrap}.gt td{color:var(--mu)}.gt td:first-child{color:var(--tx);font-weight:700}.pt:has(.tw){max-width:none}

<body>
<header class="top"><div class="hi"><a class="brand" href="#inicio">Historia de América</a><nav class="nav" id="nav" aria-label="Secciones"></nav><button class="tt" id="tt" aria-label="Cambiar entre tema claro y oscuro">◐</button></div></header>
<main>
<section class="view" id="inicio"><div class="hero"><div class="flag" role="img" aria-label="Océano, selva y montaña"></div><h1>América</h1>
<p class="lead">Pueblos originarios, viajes de exploración, conquista, independencias y los proyectos del futuro: la historia del continente americano.</p>
<div class="stn" id="stn"></div></div>
<div class="grid home" id="home"></div>
<p class="note">Resumen educativo: no reemplaza a los libros de historia. Las fechas y cifras son aproximadas y los datos recientes pueden cambiar.</p></section>
</main>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const V=[['linea','Línea del tiempo','De los pueblos originarios a la actualidad.','Historia'],['conquista','Conquista','España, Portugal y Gran Bretaña en América.','Conquista'],['colonias','Primeras colonias','Las ciudades y colonias fundadas desde 1493.','Colonias'],['revoluciones','Revoluciones','De Estados Unidos y Haití a las independencias hispanoamericanas.','Revoluciones'],['guerras','Guerras y conflictos','Línea del tiempo de las guerras en América.','Guerras'],['estados','Nuevos estados','Cuándo se independizó cada país.','Estados'],['ultramar','Territorios en disputa o de ultramar','Territorios americanos de potencias no americanas.','Ultramar'],['politica','Sistemas políticos','De los imperios originarios a las repúblicas actuales.','Política'],['clima','Clima','De los polos al trópico y a los Andes.','Clima'],['rios','Ríos y mares','Grandes ríos, lagos, océanos y mares.','Ríos y mares'],['fauna','Fauna y flora','Selvas, montañas, praderas y cultivos.','Fauna y flora'],['recursos','Recursos minerales','Plata, oro, cobre, litio y petróleo.','Minerales'],['futuro','Proyectos futuros','Corredores, canales y energía.','Futuro']];
$('main').insertAdjacentHTML('beforeend',V.map(v=>`<section class="view" id="${v[0]}"><div class="sec"><h2>${v[1]}</h2><p class="lead">${v[2]}</p><div id="b-${v[0]}"></div></div></section>`).join(''));
$('#nav').innerHTML=V.map(v=>`<a class="nl" href="#${v[0]}" data-v="${v[0]}">${v[3]}</a>`).join('');
$('#home').innerHTML=V.map(v=>`<a class="card" href="#${v[0]}"><h3>${v[1]}</h3><p>${v[2]}</p></a>`).join('');
$('#stn').innerHTML=[['1492','Colón llega a América','linea'],['1500','Cabral llega a Brasil','linea'],['1521','Cae Tenochtitlan','conquista'],['1607','Jamestown','colonias'],['1776','Independencia de EE. UU.','revoluciones'],['1804','Haití independiente','revoluciones'],['1810','Revoluciones hispanoamericanas','revoluciones'],['1822','Brasil se independiza','estados'],['2026','Corredores bioceánicos','futuro']].map(s=>`<a class="st" href="#${s[2]}"><b>${s[0]}</b><span>${s[1]}</span></a>`).join('');
function go(h){const id=V.some(v=>v[0]===h)?h:'inicio';$$('.view').forEach(e=>e.classList.toggle('on',e.id===id));$$('.nl').forEach(e=>e.classList.toggle('on',e.dataset.v===id));scrollTo(0,0);const a=$('.nl.on');a&&a.scrollIntoView({inline:'center',block:'nearest'})}
addEventListener('hashchange',()=>go(location.hash.slice(1)));
$('#tt').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';try{localStorage.setItem('ha-theme',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('ha-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const P=t=>`<p>${t}</p>`,tl=a=>`<div class="tl">${a.map(x=>`<div class="ev"><b>${x[0]}</b><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>`,two=(a,x,b,y)=>`<div class="two"><div><b>${a}</b>${P(x)}</div><div><b>${b}</b>${P(y)}</div></div>`,ul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
function tabs(id,D){const e=$('#b-'+id);e.innerHTML=`<div class="tabs" role="tablist">${D.map((d,i)=>`<button class="tab" role="tab" style="--c:var(--c${i%5+1})" data-i="${i}">${d[0]}</button>`).join('')}</div><div class="panel" role="tabpanel"></div>`;const p=$('.panel',e),sel=i=>{$$('.tab',e).forEach((t,j)=>t.setAttribute('aria-selected',i===j));p.style.setProperty('--c',`var(--c${i%5+1})`);p.innerHTML=`<h3>${D[i][1]}</h3><div class="pt">${D[i][2]}</div>`};e.onclick=ev=>{const t=ev.target.closest('.tab');t&&sel(+t.dataset.i)};sel(0)}
const cards=a=>`<div class="grid">${a.map(c=>`<div class="card"><span class="tag">${c[1]}</span><h3>${c[0]}</h3><p>${c[2]}</p></div>`).join('')}</div>`;
const R=t=>t.trim().split('\n').map(l=>l.split('|')),gt=(h,r)=>`<div class="tw"><table class="gt"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${R(r).map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const T=t=>tl(R(t)),C=t=>cards(R(t));
tabs('linea',[
['Antes de 1492','Pueblos originarios',T(`Hace más de 15.000 años|Primeros pobladores|Los primeros pueblos llegaron desde Asia y se expandieron por todo el continente.
Hace unos 5.000 años|Caral|Ciudad de la costa peruana, una de las más antiguas de América.
250–900 d. C.|Período clásico maya|Ciudades como Tikal, con escritura y calendario propios.

Siglos XIV–XV|Aztecas e incas|Tenochtitlan se fundó hacia 1325 y el Tawantinsuyo tenía su capital en Cusco.`)],
['Descubrimiento','Los viajes de exploración (1492–1522)',T(`1492|Cristóbal Colón|Parte de Palos el 3 de agosto y llega a Guanahaní, en las Bahamas, el 12 de octubre.

['Siglos XVI–XVIII','Conquista y colonia',T(`1519–1521|Cortés|Con aliados indígenas conquista el Imperio mexica y cae Tenochtitlan.

['Siglos XIX–XXI','Independencias y repúblicas',T(`1804|Haití|Primera república independiente de América Latina.

1948|OEA|Se funda la Organización de los Estados Americanos.
1981|Belice|Se independiza de Gran Bretaña.`)]]);

tabs('conquista',[
['España','Conquista y Monarquía Hispánica',P('España conquistó desde México y el Caribe hasta Chile y el Río de la Plata. Ayudaron las alianzas con pueblos enemigos de los imperios, las enfermedades traídas de Europa, los caballos y las armas de fuego.')+ul(['<b>Instituciones:</b> Casa de Contratación (1503), Consejo de Indias (1524), virreinatos y audiencias.','<b>Mano de obra:</b> encomienda y mita; las Leyes de Burgos (1512) y las Leyes Nuevas (1542) intentaron limitarlas.','<b>Defensor de los indígenas:</b> fray Bartolomé de las Casas.','<b>Economía:</b> plata de Potosí y Zacatecas, enviada a España en flotas.'])],
['Portugal','Brasil portugués',P('Por el Tratado de Tordesillas (1494) Portugal recibió la costa del actual Brasil, que Cabral alcanzó en 1500.')+ul(['<b>1532:</b> se funda São Vicente.','<b>1534:</b> capitanías hereditarias.','<b>1549:</b> gobierno general, con capital en Salvador.','<b>Azúcar y esclavitud:</b> llegaron casi cinco millones de africanos esclavizados.','<b>Expansión:</b> los bandeirantes avanzaron al oeste de la línea de Tordesillas.','<b>1808:</b> la corte portuguesa se traslada a Río de Janeiro.'])],
['Gran Bretaña','Las colonias británicas',P('Inglaterra llegó más tarde y colonizó con compañías y colonos que buscaban tierra o libertad religiosa.')+ul(['<b>Norteamérica:</b> Jamestown (1607), Plymouth (1620) y las Trece Colonias, con asambleas locales.','<b>Caribe:</b> Barbados (1627) y Jamaica, tomada a España en 1655; economía del azúcar.','<b>Canadá:</b> la Compañía de la Bahía de Hudson (1670) y, desde 1763, la antigua Nueva Francia.','<b>Economía:</b> tabaco, azúcar, pieles y trabajo esclavo.'])],
['Otras potencias','Francia y Países Bajos',P('Francia fundó Quebec (1608) y Saint-Domingue (hoy Haití). Los Países Bajos fundaron Nueva Ámsterdam (1624) y colonias en Surinam.')]]);

$('#b-colonias').innerHTML=C(`La Isabela|1493 · La Española|Fundada por Colón en su segundo viaje; fue abandonada pocos años después.
Santo Domingo|1496 · La Española|Considerada la ciudad europea más antigua de América con habitantes de forma continua.
Ciudad de México|1521 · Nueva España|Se levantó sobre Tenochtitlan y fue capital del virreinato desde 1535.

Nueva Ámsterdam|1624 · Países Bajos|Pasó a Inglaterra en 1664 y hoy es Nueva York.`);

['Estados Unidos','Revolución estadounidense (1765–1783)',T(`1765–1773|Impuestos y protesta|La Ley del Timbre y el motín del té de Boston enfrentan a las colonias con Londres.
1775|Primeros combates|Lexington y Concord, el 19 de abril.

['Haití','Revolución haitiana (1791–1804)',T(`1791|Insurrección|Los esclavizados de Saint-Domingue se levantan en agosto.

['Hispanoamérica','Independencias hispanoamericanas (1808–1826)',T(`1780|Túpac Amaru II|Gran rebelión indígena en el Alto Perú.
1808|Napoleón invade España|La crisis del rey abre paso a juntas de gobierno.
1810|Primeras juntas|Caracas (19 de abril), Buenos Aires (25 de mayo), Bogotá (20 de julio) y Santiago (18 de septiembre). Hidalgo inicia la lucha en México el 16 de septiembre.

1817–1818|San Martín|Cruza los Andes y gana en Chacabuco y Maipú.
