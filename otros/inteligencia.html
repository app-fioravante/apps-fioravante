const M={
claude:{c:'vi',by:'Anthropic (EE. UU.)',yr:'2023',k:'Escribir, programar y leer documentos largos',d:'Un asistente de conversación creado por Anthropic, empresa que pone el foco en la seguridad y en que la IA sea confiable.',ok:[['Textos largos','Maneja documentos extensos y mantiene el hilo con mucho detalle.'],['Programación','Muy usado para escribir, revisar y explicar código.'],['Tono cuidado','Suele responder de forma ordenada, matizada y honesta sobre lo que no sabe.']],no:[['Tres tamaños','La familia suele dividirse en Haiku (rápido), Sonnet (equilibrado) y Opus (el más potente).'],['No es infalible','Como toda IA, puede equivocarse: conviene verificar datos importantes.']]},
gemini:{c:'cy',by:'Google DeepMind (EE. UU.)',yr:'2023 (antes Bard)',k:'Trabajar con texto, imagen, audio y video a la vez',d:'El asistente de Google. Nació «multimodal»: entiende y combina distintos tipos de contenido, no solo texto.',ok:[['Multimodal','Puede analizar una foto, un audio o un video junto con tu pregunta.'],['Integrado con Google','Se conecta con Gmail, Docs, Drive, Android y la Búsqueda.'],['Contexto muy amplio','Admite grandes cantidades de información en una sola consulta.']],no:[['Versiones','Hay variantes rápidas (Flash) y más potentes (Pro); cambian con frecuencia.'],['Datos y cuenta','Al estar ligado a tu cuenta de Google, conviene revisar qué permisos le das.']]},
chatgpt:{c:'pk',by:'OpenAI (EE. UU.)',yr:'2022',k:'Uso general: conversar, crear y consultar la web',d:'El asistente que popularizó la IA generativa. Su lanzamiento a fines de 2022 marcó un antes y un después.',ok:[['Todo terreno','Redacta, resume, traduce, programa y explica casi cualquier tema.'],['Voz e imágenes','Permite conversar hablando, analizar fotos y generar imágenes.'],['Personalizable','Admite asistentes a medida, memoria y búsqueda en la web.']],no:[['Alucinaciones','Puede inventar datos con mucha seguridad: hay que contrastar.'],['Planes','Las funciones más avanzadas suelen depender del plan que se use.']]},
deepseek:{c:'ye',by:'DeepSeek (China)',yr:'2023 (fama en 2025)',k:'Razonamiento y modelos abiertos',d:'Empresa china que sorprendió en 2025 con DeepSeek-R1, un modelo de razonamiento competitivo y de pesos abiertos.',ok:[['Pesos abiertos','Sus modelos se pueden descargar y usar en tu propia máquina.'],['Razonamiento','Muestra pasos intermedios al resolver problemas de lógica, cálculo y código.'],['Bajo costo','Su uso por API suele ser más barato que el de otros modelos.']],no:[['Privacidad','En la app o web, los datos se procesan en servidores de la empresa en China: revisar su política.'],['Censura','Puede evitar ciertos temas políticos sensibles.'],['Tamaño','El modelo completo es enorme; en una PC común se usan versiones reducidas.']]}};
const GL=[['Inteligencia artificial (IA)','Programas que hacen tareas que antes requerían inteligencia humana: entender texto, reconocer imágenes, decidir.'],['Algoritmo','Lista de pasos que sigue una computadora para resolver algo. Como una receta.'],['Aprendizaje automático','Método donde la máquina aprende patrones a partir de ejemplos, en vez de seguir reglas escritas a mano.'],['Aprendizaje profundo','Aprendizaje automático con redes neuronales de muchas capas. Es lo que impulsa la IA actual.'],['Red neuronal','Sistema inspirado de lejos en el cerebro: muchas «neuronas» matemáticas conectadas que se ajustan al aprender.'],['Modelo','El «cerebro» ya entrenado de una IA. Claude, Gemini o GPT son modelos.'],['LLM','Modelo de lenguaje grande. Una IA entrenada con enormes cantidades de texto para entender y generar lenguaje.'],['Transformer','Arquitectura de 2017 que permite a la IA prestar atención a las partes importantes del texto. Base de los LLM.'],['Token','Trozo de texto (una palabra o parte de ella) con el que trabaja el modelo. Se usa para medir longitud y costo.'],['Parámetros','Los «diales» internos del modelo que se ajustan al entrenar. Más parámetros suele significar un modelo más capaz y más pesado.'],['Entrenamiento','Etapa en la que el modelo aprende de muchísimos datos. Lleva semanas o meses y mucho costo.'],['Inferencia','Cuando el modelo ya entrenado responde a tu pregunta.'],['Prompt','La instrucción o pregunta que le escribes a la IA.'],['Ventana de contexto','Cantidad de texto que el modelo puede tener «a la vista» a la vez en una conversación.'],['Alucinación','Cuando la IA inventa algo falso pero con apariencia de verdad.'],['Sesgo','Tendencia injusta heredada de los datos de entrenamiento, que puede reflejarse en las respuestas.'],['IA generativa','IA que crea contenido nuevo: texto, imágenes, audio, video o código.'],['Multimodal','Capaz de trabajar con varios tipos de contenido a la vez, como texto e imagen.'],['Agente','IA que no solo responde: planifica pasos y usa herramientas para cumplir una tarea.'],['RAG','Técnica que busca información en tus documentos antes de responder, para apoyarse en datos reales.'],['Ajuste fino (fine-tuning)','Reentrenar un modelo con datos específicos para especializarlo en un tema.'],['Pesos abiertos','Modelos cuyos «parámetros» se publican para que cualquiera los descargue y use.'],['Cuantización','Comprimir un modelo para que ocupe menos memoria, con una pequeña pérdida de calidad.'],['GPU','Placa de video. Hace muchos cálculos en paralelo, ideal para entrenar y ejecutar IA.'],['Temperatura','Ajuste que controla cuán creativa o previsible es la respuesta.'],['AGI','Inteligencia artificial general: una IA hipotética capaz de aprender cualquier tarea intelectual como una persona.']];
const V={};
V.inicio=`<section class="hero"><div class="tag"><i></i>Guía sencilla · 2026</div><h1>La <span class="ac">inteligencia artificial</span>, en <span class="ap">lenguaje sencillo</span></h1><p class="lead">Qué es, de dónde viene, cómo pedirle las cosas, quiénes son los principales asistentes y cómo usarla en tu propia computadora. Sin tecnicismos.</p><div class="acts"><a class="btn b1" href="#linea" data-r="linea">Empezar el recorrido →</a><a class="btn b2" href="#glosario" data-r="glosario">Ir al glosario</a></div><div class="wf" id="wf"></div></section>
<div class="stats"><div class="stat cy"><div class="num" data-n="70" data-s="+">0</div><div class="lbl">Años de historia</div></div><div class="stat pk"><div class="num" data-n="4" data-s="">0</div><div class="lbl">Asistentes explicados</div></div><div class="stat vi"><div class="num" data-n="3" data-s="">0</div><div class="lbl">Niveles de IA por capacidad</div></div><div class="stat ye"><div class="num" data-n="${GL.length}" data-s="">0</div><div class="lbl">Términos en el glosario</div></div></div>
<div class="grid" style="margin-top:32px">${S.map((s,i)=>`<a class="nc reveal" href="#${s[0]}" data-r="${s[0]}"><small>${String(i+1).padStart(2,'0')}</small><h4>${s[1]}</h4><p>${s[2]}</p><b>Abrir →</b></a>`).join('')}</div>
${K('En una frase:','la IA es un programa que aprendió patrones a partir de enormes cantidades de ejemplos y los usa para responder, crear o decidir. No «sabe» como una persona: calcula lo más probable.')}`;
V.linea=H('Historia','Línea del tiempo','Más de siete décadas en once escalones. Desliza hacia el costado para recorrerla.')+`<div class="tt">${TL.map(t=>`<div class="tl"><div class="y">${t[0]}</div><div class="e">${t[1]}</div><h4>${t[2]}</h4><p>${t[3]}</p></div>`).join('')}</div><div class="hint">← desliza →</div>`+K('Idea clave:','la IA no apareció de golpe. Tardó décadas en combinar tres ingredientes: mejores ideas, muchísimos datos y computadoras muy potentes.','pk');
V.clasificacion=H('Tipos','Clasificación actual','Hay dos formas simples de ordenar la IA: por lo que es capaz de hacer y por el tipo de tarea.')+`<h3 class="sub">Por capacidad</h3>`+G(C('IA estrecha','Hace muy bien una cosa o un grupo de cosas. Es toda la IA que existe hoy, incluidos los asistentes.','cy','<span class="st">Existe hoy</span>')+C('IA general (AGI)','Una IA que aprendería cualquier tarea intelectual como una persona. Es objetivo de varias empresas, pero no existe.','pk','<span class="st">En debate</span>')+C('Superinteligencia','Una IA muy superior al conjunto de la humanidad. Por ahora es solo una hipótesis teórica.','vi','<span class="st">Teórica</span>'))+`<h3 class="sub">Por tipo de tarea</h3>`+G(C('Generativa','Crea contenido nuevo: texto, imágenes, música, video y código. Ej.: ChatGPT, Claude, Gemini.','cy')+C('Predictiva','Anticipa resultados a partir de datos pasados: clima, fraudes, demanda, recomendaciones.','pk')+C('De percepción','Ve, oye o reconoce: caras, voz, objetos, señales de tránsito. Está en tu celular.','vi')+C('Agentes','Planifican y ejecutan tareas de varios pasos usando herramientas. Es la categoría que más crece.','ye'))+K('Importante:','los asistentes de las próximas secciones son IA estrecha y generativa: muy buenos con el lenguaje, pero sin comprensión humana.','ye');
V.prompt=H('Cómo pedir','Prompt','Un prompt es lo que le escribes a la IA. Cuanto más claro, mejor la respuesta.')+`<div class="steps reveal">${[['Dale un rol','«Eres docente», «actúa como contador». Orienta el tono y el nivel.'],['Explica el contexto','Quién eres, para qué lo necesitas y para quién es el resultado.'],['Pide una tarea concreta','Un verbo claro: resume, compara, redacta, corrige, explica.'],['Indica el formato','Lista, tabla, cinco líneas, tono formal, nivel principiante.'],['Mejora en conversación','Si no sale bien, no empieces de cero: pide ajustes («más corto», «con un ejemplo»).']].map((s,i)=>`<div class="step"><div class="sn2">${i+1}</div><div><strong>${s[0]}</strong><p>${s[1]}</p></div></div>`).join('')}</div><div class="cmp reveal"><div class="ip pk"><b>Prompt flojo</b><p>«Háblame de energía solar.»</p></div><div class="ip cy"><b>Prompt claro</b><p>«Eres docente de secundaria. Explica la energía solar a estudiantes de 14 años en 5 puntos cortos, con un ejemplo cotidiano y una frase de cierre.»</p></div></div>`+K('Consejo:','no compartas datos personales ni confidenciales en un prompt, y revisa siempre lo que responde: la IA puede equivocarse.','vi');
Object.keys(M).forEach(id=>{const m=M[id],n=S.find(s=>s[0]==id)[1];V[id]=H('Asistente',n,m.d)+`<div class="stats ${m.c}"><div class="stat"><div class="num s">${m.by}</div><div class="lbl">Empresa</div></div><div class="stat"><div class="num s">${m.yr}</div><div class="lbl">Lanzamiento</div></div><div class="stat"><div class="num s">${m.k}</div><div class="lbl">Se destaca en</div></div></div><h3 class="sub">Fortalezas</h3>`+G(m.ok.map(x=>C(x[0],x[1],m.c)).join(''))+`<h3 class="sub">Para tener en cuenta</h3>`+G(m.no.map(x=>C(x[0],x[1],'pk')).join(''))});
V.futuro=H('Mirando adelante','Proyectos futuros','Lo que se investiga y se construye hoy. Son tendencias, no promesas con fecha.')+G(C('Agentes autónomos','Asistentes que reservan, compran, programan o investigan por su cuenta, con supervisión humana.','cy','<span class="st">En desarrollo</span>')+C('IA en ciencia y salud','Ayuda a descubrir fármacos, plegar proteínas y leer estudios médicos.','pk','<span class="st">En uso</span>')+C('Robots humanoides','Robots con IA para trabajar en fábricas, depósitos y, a futuro, hogares.','vi','<span class="st">En desarrollo</span>')+C('IA personal en el dispositivo','Modelos pequeños que funcionan en el celular o la PC, sin enviar datos a la nube.','ye','<span class="st">En uso</span>')+C('Voz y video en tiempo real','Conversar con fluidez, traducir al instante y generar video realista.','cy','<span class="st">En desarrollo</span>')+C('Regulación y seguridad','Leyes, auditorías y pruebas para que la IA sea segura, transparente y justa.','pk','<span class="st">En uso</span>')+C('IA general (AGI)','El gran objetivo de largo plazo. Los expertos discrepan sobre si llegará y cuándo.','vi','<span class="st">Investigación</span>'))+K('Para pensar:','cada avance trae preguntas sobre trabajo, educación, derechos de autor y privacidad. Entender la IA es el primer paso para decidir cómo usarla.','ye');
V.local=H('Sin nube','IA en modo local','Correr un modelo en tu propia computadora: tus datos no salen de tu equipo y funciona sin internet.')+`<div class="stats"><div class="stat cy"><div class="num s">8 GB</div><div class="lbl">RAM para modelos chicos</div></div><div class="stat pk"><div class="num s">16 GB o más</div><div class="lbl">RAM recomendada</div></div><div class="stat vi"><div class="num s">GPU</div><div class="lbl">Acelera mucho (opcional)</div></div><div class="stat ye"><div class="num s">Varios GB</div><div class="lbl">Espacio por modelo</div></div></div><h3 class="sub">Programas para empezar</h3>`+G(C('Ollama','Se instala y se maneja con un comando. Descarga y ejecuta modelos con mucha facilidad.','cy')+C('LM Studio','Interfaz gráfica con buscador de modelos y chat. Ideal para quien prefiere ventanas.','pk')+C('GPT4All','Muy simple de usar; permite conversar con tus propios documentos.','vi')+C('llama.cpp','Motor técnico en el que se apoyan muchos programas. Para usuarios avanzados.','ye'))+`<h3 class="sub">Paso a paso</h3><div class="steps reveal">${[['Instala un programa','Por ejemplo Ollama o LM Studio, desde su sitio oficial.'],['Elige un modelo','Prueba uno chico de familias abiertas como Llama, Gemma, Qwen, Mistral o versiones reducidas de DeepSeek.'],['Descárgalo','En Ollama: <code>ollama run nombre-del-modelo</code>. En LM Studio, desde el buscador.'],['Conversa','Escribe como en cualquier asistente. La primera respuesta puede tardar unos segundos.'],['Ajusta','Si va lento, prueba un modelo más chico o una versión cuantizada.']].map((s,i)=>`<div class="step"><div class="sn2">${i+1}</div><div><strong>${s[0]}</strong><p>${s[1]}</p></div></div>`).join('')}</div>`+K('Ventajas:','privacidad total, sin costo por uso, funciona sin conexión y tienes el control.','cy')+K('Límites:','suele ser menos potente que los modelos gigantes de la nube, más lento sin GPU y ocupa espacio en disco.','pk');
V.glosario=H('Diccionario','Glosario','Escribe para buscar un término o parte de su definición.')+`<input class="gs" id="gs" type="search" placeholder="Buscar: token, prompt, LLM…" aria-label="Buscar en el glosario"><div class="gg" id="gg"></div><div class="ge" id="ge">Sin resultados</div>`;
const T=document.documentElement;
function setT(t){T.dataset.theme=t;try{localStorage.setItem('ia-tema',t)}catch(e){}}
let sv=null;try{sv=localStorage.getItem('ia-tema')}catch(e){}setT(sv||'dark');
$('#tb').onclick=()=>setT(T.dataset.theme=='dark'?'light':'dark');
$('#nav').innerHTML=S.map(s=>`<a href="#${s[0]}" data-r="${s[0]}">${s[1]}</a>`).join('');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -30px 0px'});
function counters(){$$('.num[data-n]').forEach(el=>{const t=+el.dataset.n,s=el.dataset.s,t0=performance.now();(function k(n){const p=Math.min((n-t0)/1400,1);el.textContent=Math.round(t*(1-Math.pow(1-p,3)))+s;if(p<1)requestAnimationFrame(k)})(t0)})}
function glos(){const g=$('#gg'),e=$('#ge');const r=q=>{q=q.trim().toLowerCase();const x=GL.filter(i=>!q||i[0].toLowerCase().includes(q)||i[1].toLowerCase().includes(q));g.innerHTML=x.map(i=>`<div class="gi"><h4>${i[0]}</h4><p>${i[1]}</p></div>`).join('');e.style.display=x.length?'none':'block'};r('');$('#gs').oninput=ev=>r(ev.target.value)}
function go(r,push=true){if(!V[r])r='inicio';$('#main').innerHTML=`<section class="view">${V[r]}<div class="foot"><span><strong>IA sencilla</strong> · Guía en lenguaje simple</span><span>Datos a octubre de 2026 · verifica novedades</span></div></section>`;
$$('.nav a').forEach(a=>{const on=a.dataset.r==r;a.classList.toggle('on',on);if(on)a.scrollIntoView({inline:'center',block:'nearest'})});
if(push&&location.hash.slice(1)!=r)history.pushState(null,'','#'+r);scrollTo({top:0,behavior:'smooth'});
if(r=='inicio'){$('#wf').innerHTML=Array.from({length:56},(_,i)=>`<i style="--d:${(i*.07).toFixed(2)}s;--h:${30+Math.abs(Math.sin(i*.5))*70}%"></i>`).join('');counters()}
if(r=='glosario')glos();$$('.reveal').forEach(el=>io.observe(el))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-r]');if(t){e.preventDefault();go(t.dataset.r)}});
addEventListener('popstate',()=>go(location.hash.slice(1)||'inicio',false));
addEventListener('scroll',()=>{const h=T,m=h.scrollHeight-h.clientHeight;$('#pl').style.width=(m>0?h.scrollTop/m*100:0)+'%'},{passive:true});
document.addEventListener('mousemove',e=>{const c=e.target.closest('.pc');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)/r.width*100+'%');c.style.setProperty('--my',(e.clientY-r.top)/r.height*100+'%')}});
go(location.hash.slice(1)||'inicio',false);
</script>
</body>
</html>
