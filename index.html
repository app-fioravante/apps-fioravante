<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Rómulo Fioravante App</title>
<meta name="description" content="Repositorio de aplicaciones de Rómulo Fioravante: accesos personales, laborales y del hogar en un solo lugar.">
<meta name="theme-color" content="#d5e7f8">
<script>
  /* Franjas: amanecer 5-7, mañana 7-12, tarde 12-18, atardecer 18-20, noche 20-5.
     Para probar una hora: ?hora=19:30 */
  function rfSky() {
    var p = (new URLSearchParams(location.search).get('hora') || '').match(/^(\d{1,2}):(\d{2})$/);
    var d = new Date(), x = p ? +p[1] + p[2] / 60 : d.getHours() + d.getMinutes() / 60;
    var s = x >= 5 && x < 7 ? 'amanecer' : x >= 7 && x < 12 ? 'manana' : x >= 12 && x < 18 ? 'tarde' : x >= 18 && x < 20 ? 'atardecer' : 'noche';
    var r = document.documentElement;
    if (r.getAttribute('data-sky') === s) return;
    r.setAttribute('data-sky', s);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', { amanecer: '#fbdcc0', manana: '#d5e7f8', tarde: '#f6d9e4', atardecer: '#fbdcc0', noche: '#b4c4ea' }[s]);
  }
  rfSky();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,700&display=swap" rel="stylesheet">
<style>
  @property --sky-1 { syntax: '<color>'; inherits: true; initial-value: #e6f1fc; }
  @property --sky-2 { syntax: '<color>'; inherits: true; initial-value: #d5e7f8; }
  @property --sky-3 { syntax: '<color>'; inherits: true; initial-value: #c6dcf3; }
  @property --glow { syntax: '<color>'; inherits: true; initial-value: #f5faff; }
  @property --muted { syntax: '<color>'; inherits: true; initial-value: #46607f; }
  :root {
    --sky-1: #e6f1fc;
    --sky-2: #d5e7f8;
    --sky-3: #c6dcf3;
    --glow: #f5faff;
    --ink: #0c2a60;
    --muted: #46607f;
    --pill: rgba(255, 255, 255, 0.55);
    --pill-line: rgba(12, 42, 96, 0.14);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 4vh, 36px);
    padding: 24px 20px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(60% 48% at 50% 44%, var(--glow) 0%, rgba(245, 250, 255, 0) 72%),
      radial-gradient(45% 40% at 100% 100%, var(--sky-3) 0%, rgba(198, 220, 243, 0) 70%),
      linear-gradient(160deg, var(--sky-1) 0%, var(--sky-2) 58%, var(--sky-3) 100%);
    background-color: var(--sky-2);
    overflow-x: hidden;
  }

  main { width: min(34vw, 170px, calc(24vh * 2.03)); }
  /* Estado final: firma + nombre quedan chicos, estilo logo */
  body.docked main { width: min(26vw, 104px); }

  svg#canvas {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    /* Realce mínimo: la firma parece grabada en el propio fondo */
    filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.9)) drop-shadow(0 2px 3px rgba(12, 42, 96, 0.12));
  }
  #sig { transition: opacity 0.5s ease; }

  .ink {
    fill: none;
    stroke: var(--ink);
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1 1;
    stroke-dashoffset: 1;
    opacity: 0;
    transition: stroke-width 1.1s cubic-bezier(0.65, 0, 0.35, 1);
  }
  /* Al achicarse, el trazo se engrosa en unidades SVG para conservar el mismo grosor visual */
  body.docked .ink { stroke-width: 5.6; }
  #name path { transition: stroke-width 1.1s cubic-bezier(0.65, 0, 0.35, 1); }
  body.docked #name path { stroke-width: 1.8; }
  #dot {
    fill: var(--ink);
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    transition: transform 0.35s cubic-bezier(0.25, 1.7, 0.45, 1);
  }
  #nib { opacity: 0; transition: opacity 0.25s ease; }
  #nib .halo { fill: var(--ink); opacity: 0.12; }
  #nib .tip { fill: var(--ink); }

  .caption {
    margin: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(16px, 2.4vw, 20px);
    line-height: 1.35;
    letter-spacing: 0.02em;
    color: var(--ink);
    max-width: min(92vw, 560px);
    text-wrap: balance;
    transition: opacity 0.5s ease;
  }
  .caption .ch { opacity: 0; transition: opacity 0.16s ease; }
  .caption .ch.on { opacity: 1; }
  .caption.instant, .caption.instant .ch { transition: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* En pantallas chicas el trazo se engrosa un poco para que se mantenga visible */
  @media (max-width: 480px) { .ink { stroke-width: 4.4; } body.docked .ink { stroke-width: 5.6; } }

  .hero { display: flex; flex-direction: column; align-items: center; gap: clamp(16px, 3.4vh, 30px); }
  .brand { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 14px); }

  /* Estado final: el bloque sube al borde superior y debajo aparece el sistema */
  .reveal { display: none; flex: 1; width: 100%; flex-direction: column; align-items: center; gap: clamp(16px, 3vh, 28px); }
  body.docked { justify-content: flex-start; padding-top: clamp(14px, 3vh, 28px); }
  body.docked .reveal { display: flex; }
  body.docked #caption { display: none; }

  .sys {
    margin: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(21px, 3.2vw, 28px);
    line-height: 1.2;
    color: var(--ink);
    text-wrap: balance;
  }

  [hidden] { display: none !important; }
  .home { flex: 1; width: 100%; max-width: 920px; display: flex; flex-direction: column; align-items: center; gap: clamp(16px, 3vh, 26px); }
  .areas { list-style: none; margin: 0; padding: 0; width: 100%; flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(92px, 1fr); }
  .areas li {
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 0;
    font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500;
    font-size: clamp(22px, 3.4vw, 34px); line-height: 1.15; color: var(--ink); text-wrap: balance;
    border-bottom: 1px solid var(--pill-line);
  }
  .areas li.b { font-weight: 700; }
  .areas button {
    appearance: none; width: 100%; height: 100%; padding: 20px 14px; border: 0; background: transparent;
    font: inherit; color: inherit; text-align: center; text-wrap: balance; cursor: pointer; transition: background-color 0.25s ease;
  }
  .areas button:hover { background: rgba(255, 255, 255, 0.4); }
  .areas button:focus-visible { outline: 2px solid var(--ink); outline-offset: -6px; }
  @media (min-width: 721px) {
    .areas li:not(:nth-child(3n)) { border-right: 1px solid var(--pill-line); }
    .areas li:nth-last-child(-n+3) { border-bottom: 0; }
  }
  @media (max-width: 720px) {
    .areas { grid-template-columns: 1fr 1fr; }
    .areas li:nth-child(odd) { border-right: 1px solid var(--pill-line); }
    .areas li:last-child { border-bottom: 0; grid-column: 1 / -1; border-right: 0; }
  }

  /* Aparición suave: de borroso a nítido, uno tras otro */
  .fade { opacity: 0; filter: blur(6px); transition: opacity 1s ease, filter 1s ease; transition-delay: calc(var(--i, 0) * 180ms); }
  .reveal.show .fade { opacity: 1; filter: none; }
  .reveal:not(.show) { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .fade { transition: none; } }

  /* Sección abierta: el título elegido queda bajo el sistema, con Volver en la misma línea */
  .reveal.show .home.leaving .fade:not(.picked) { opacity: 0; filter: blur(4px); transition-duration: 0.3s; transition-delay: 0s; }
  .areas button span { display: inline-block; }
  .reveal.open .home { display: none; }
  .reveal.open .detail { display: flex; }
  .reveal.open .bar { display: grid; }

  .bar { display: none; width: 100%; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .sel {
    grid-column: 2;
    justify-self: center;
    margin: 0;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(21px, 3.4vw, 30px);
    line-height: 1.15;
    text-align: center;
    color: var(--ink);
  }
  .sel.b { font-weight: 700; }
  .back {
    grid-column: 3;
    justify-self: end;
    appearance: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    line-height: 1;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid var(--pill-line);
    border-radius: 999px;
    padding: 10px 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, background-color 0.2s ease;
  }
  .bar.ready .back { opacity: 1; pointer-events: auto; }
  .back:hover { background: rgba(255, 255, 255, 0.85); }
  .back:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }


  /* Contenido de index: buscador, recientes, accesos */
  .sub, .dd, .rl { margin: 0; text-align: center; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; color: var(--muted); }
  .sub { font-size: clamp(16px, 2.4vw, 19px); }
  .dd { font-size: clamp(16px, 2.4vw, 19px); }
  .rl { font-size: 17px; margin-right: 4px; }
  .search { position: relative; width: 100%; max-width: 560px; align-self: center; }
  .search input {
    width: 100%; height: 52px; padding: 0 48px 0 24px; border: 1px solid var(--pill-line); border-radius: 999px;
    background: var(--pill); color: var(--ink); outline: none; -webkit-appearance: none; appearance: none;
    font: italic 500 clamp(18px, 2.6vw, 21px) 'Cormorant Garamond', Georgia, serif;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .search input::placeholder { color: var(--muted); opacity: 0.85; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input:focus { background: rgba(255, 255, 255, 0.85); border-color: var(--ink); }
  .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
  .clear:hover { background: rgba(255, 255, 255, 0.7); color: var(--ink); }
  .recents { width: 100%; max-width: 680px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
  .chip { display: inline-block; max-width: 100%; padding: 9px 16px; border: 1px solid var(--pill-line); border-radius: 999px; background: var(--pill); color: var(--ink); font-size: 14px; font-weight: 500; line-height: 1; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background-color 0.2s ease; }
  .chip:hover { background: rgba(255, 255, 255, 0.85); }
  .link { appearance: none; border: 0; background: none; padding: 6px; font: inherit; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .link:hover { color: var(--ink); }
  .results, .detail { width: 100%; max-width: 680px; }
  .detail { display: none; flex-direction: column; gap: 14px; opacity: 0; filter: blur(6px); transition: opacity 0.35s ease, filter 0.35s ease; }
  .detail.in { opacity: 1; filter: none; }
  .group + .group { margin-top: 18px; }
  .gt { margin: 0 6px 6px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 700; font-size: clamp(19px, 2.8vw, 23px); line-height: 1.2; color: var(--ink); }
  .list { border-top: 1px solid var(--pill-line); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 8px; border-bottom: 1px solid var(--pill-line); color: var(--ink); text-decoration: none; transition: background-color 0.2s ease; }
  .row:hover { background: rgba(255, 255, 255, 0.4); }
  .row:focus-visible { outline: 2px solid var(--ink); outline-offset: -3px; }
  .row-main { display: flex; flex-direction: column; min-width: 0; }
  .row-name { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; font-size: clamp(20px, 3vw, 24px); line-height: 1.2; }
  .row-sub { font-size: 12.5px; color: var(--muted); }
  .go { flex-shrink: 0; font-size: 16px; color: var(--muted); transition: transform 0.2s ease, color 0.2s ease; }
  .row:hover .go { color: var(--ink); transform: translate(1px, -1px); }
  mark { background: rgba(12, 42, 96, 0.14); color: inherit; border-radius: 3px; padding: 0 1px; }
  .meta, .empty { margin: 0 0 10px; text-align: center; font-size: 14px; color: var(--muted); }
  /* Fondo según el momento del día (mañana = celeste, la paleta base) */
  :root { transition: --sky-1 2.5s ease, --sky-2 2.5s ease, --sky-3 2.5s ease, --glow 2.5s ease, --muted 2.5s ease; }
  :root[data-sky="tarde"] { --sky-1: #fbe9ef; --sky-2: #f6d9e4; --sky-3: #efc8d8; --glow: #fff6f9; --muted: #5d4a6b; }
  :root[data-sky="amanecer"], :root[data-sky="atardecer"] { --sky-1: #fdeedd; --sky-2: #fbdcc0; --sky-3: #f6c9a4; --glow: #fff7ee; --muted: #6a4a3a; }
  :root[data-sky="noche"] { --sky-1: #cbd8f3; --sky-2: #b4c4ea; --sky-3: #9fb1de; --glow: #dfe7f9; --muted: #2f4673; }
  @media (prefers-reduced-motion: reduce) { :root { transition: none; } }
  .foot { margin: auto 0 0; padding-top: 10px; text-align: center; font-size: 12.5px; color: var(--muted); }
</style>
</head>

  let token = 0;

  // Nombre manuscrito: se revela con un barrido inclinado, letra a letra, siguiendo la plumilla
  const NAME = { b: [[68.8, 115.7], [115.7, 146.7], [146.7, 198.8], [198.8, 234.9], [234.9, 253.7], [253.7, 284.7], [284.7, 302.5], [302.5, 339.4], [339.4, 358.1], [358.1, 389.1], [389.1, 414.5], [414.5, 447.3], [447.3, 481.3], [481.3, 515.1], [515.1, 551.2], [551.2, 574.1], [574.1, 601.2]], base: 384, top: 310, bot: 402, slant: 0.25, speed: 230 };
  const wipe = document.getElementById('wipe');
  function setWipe(xe) {
    if (xe === null) { wipe.setAttribute('points', '0,0 0,0 0,0 0,0'); return; }
    const L = 20, t = NAME.top, bt = NAME.bot, s = NAME.slant;
    wipe.setAttribute('points', `${L},${t} ${xe + s * (NAME.base - t)},${t} ${xe - s * (bt - NAME.base)},${bt} ${L},${bt}`);
  }
  async function writeName(tk) {
    const b = NAME.b, text = "R\u00f3mulo Fioravante";
    for (let i = 0; i < b.length; i++) {
      const w = b[i][1] - b[i][0];
      const space = text[i] === ' ';
      const dur = w / NAME.speed * 1000 * (space ? 0.35 : 1);
      nib.style.opacity = space ? '0.4' : '1';
      const ok = await anim(dur, tk, t => {
        const e = 0.5 * t + 0.5 * ease(t);
        const xe = b[i][0] + w * e;
        setWipe(xe);
        const y = NAME.base - 22 - 20 * Math.sin(2 * Math.PI * t + 0.6);
        setNib(xe + NAME.slant * (NAME.base - y), y);
      });
      if (!ok) return false;
    }
    setWipe(700);
    return true;
  }

  const ease = t => -(Math.cos(Math.PI * t) - 1) / 2;
  const sleep = (ms, tk) => new Promise(r => setTimeout(() => r(tk === token), ms));
  const setNib = (x, y) => nib.setAttribute('transform', `translate(${x} ${y})`);

  function anim(dur, tk, fn) {
    return new Promise(res => {
      const t0 = performance.now();
      (function f(now) {
        if (tk !== token) return res(false);
        const t = Math.min(1, (now - t0) / dur);
        fn(t);
        t < 1 ? requestAnimationFrame(f) : res(true);
      })(t0);
    });
  }

  // Salto en el aire entre trazos, con un pequeño arco
  function hop(a, b, tk) {
    nib.style.opacity = '0.4';
    return anim(110, tk, t => {
      const e = ease(t);
      setNib(a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e - Math.sin(Math.PI * t) * 14);
    });
  }

  function reset() {
    paths.forEach(p => { p.style.strokeDashoffset = '1'; p.style.opacity = '0'; });
    dot.style.transform = 'scale(0)';
    setWipe(null);
    nib.style.opacity = '0';
    cap.classList.add('instant');
    chars.forEach(c => c.classList.remove('on'));
    cap.style.opacity = '1';
    void cap.offsetWidth;
    cap.classList.remove('instant');
  }

  function showAll() {
    sig.style.opacity = '1';
    paths.forEach(p => { p.style.strokeDashoffset = '0'; p.style.opacity = '1'; });
    dot.style.transform = 'scale(1)';
    setWipe(700);
    nib.style.opacity = '0';
    chars.forEach(c => c.classList.add('on'));
  }

  // Solo la firma sube al borde superior y queda fija; el texto se desvanece en su lugar y luego aparecen los títulos
  async function dock(tk) {
    cap.style.opacity = '0';
    if (!(await sleep(500, tk))) return;
    const first = hero.getBoundingClientRect();
    document.body.classList.add('docked');
    const last = hero.getBoundingClientRect();
    hero.style.transition = 'none';
    hero.style.transformOrigin = 'top left';
    hero.style.transform = `translate(${first.left - last.left}px, ${first.top - last.top}px) scale(${first.width / last.width})`;
    void hero.offsetWidth;
    hero.style.transition = 'transform 1.1s cubic-bezier(0.65, 0, 0.35, 1)';
    hero.style.transform = 'none';
    if (!(await sleep(1000, tk))) return;
    reveal.classList.add('show');
  }

  async function run() {
    const tk = ++token;
    if (reduce) { showAll(); document.body.classList.add('docked'); reveal.classList.add('show'); return; }
    while (tk === token) {
      sig.style.transition = 'none';
      reset();
      sig.style.opacity = '1';
      void sig.getBoundingClientRect();
      sig.style.transition = '';

      let cur = paths[0].getPointAtLength(0);
      setNib(cur.x, cur.y);
      nib.style.opacity = '1';
      if (!(await sleep(120, tk))) return;

      for (let i = 0; i < paths.length; i++) {
        const p = paths[i], len = lengths[i];
        const start = p.getPointAtLength(0);
        if (i > 0 && !(await hop(cur, start, tk))) return;
        nib.style.opacity = '1';
        p.style.opacity = '1';
        const ok = await anim(len / SPEED * 1000, tk, t => {
          const e = ease(t);
          p.style.strokeDashoffset = String(1 - e);
          cur = p.getPointAtLength(e * len);
          setNib(cur.x, cur.y);
        });
        if (!ok || !(await sleep(20, tk))) return;
      }

      if (!(await hop(cur, DOT, tk))) return;
      nib.style.opacity = '1';
      dot.style.transform = 'scale(1)';
      if (!(await sleep(200, tk))) return;
      if (!(await hop(DOT, { x: NAME.b[0][0] - 4, y: NAME.base - 24 }, tk))) return;
      nib.style.opacity = '1';
      if (!(await writeName(tk))) return;
      if (!(await sleep(150, tk))) return;
      nib.style.opacity = '0';

      let shown = 0;
      const typed = await anim(chars.length * 22, tk, t => {
        const n = Math.round(t * chars.length);
        while (shown < n) chars[shown++].classList.add('on');
      });
      if (!typed || !(await sleep(900, tk))) return;
      await dock(tk);
      return;
    }
  }

  const modules = [
    {
      title: "Personal",
      icon: "fa-user",
      desc: "Fotos, Veterinaria, Peso, alquiler y recibos de sueldo.",
      color: "#be123c",
      links: [
        { name: "Album de Fotos", url: "https://app-fioravante.github.io/apps-fioravante/album-fotos" },
        { name: "Veterinaria Gato Peke", url: "https://experiencia-ia.github.io/gatopeke/" },
        { name: "Peso Corporal", url: "https://app-fioravante.github.io/peso-corporal/" },
        { name: "Alquiler Vivienda", url: "https://app-fioravante.github.io/alquiler-vivienda/" },
        { name: "Recibos de Sueldo", url: "https://app-fioravante.github.io/apps-fioravante/recibos" }
      ]
    },
    {
      title: "Laboral",
      icon: "fa-briefcase",
      desc: "Sistemas y accesos del ámbito de trabajo.",
      color: "#1d4ed8",
      links: [
        { name: "Sistema Defensor-Secretarios", url: "https://sistemadigital.github.io/defensor-secretarios/" },
        { name: "Sistema Empleados", url: "https://sistemadigital.github.io/empleados/" },
        { name: "Sistema Operador y Atención", url: "https://defensoria6.github.io/operador-defensoria/" },
        { name: "Control Inasistencia-Licencias", url: "https://defensorialocal-seis.github.io/faltas-licencias/" },
        { name: "Estadística Digital", url: "https://defensoria6.github.io/reporte/" },
        { name: "Clientes y Turnos (Público)", url: "https://sistemadigital.github.io/consultas-turnos/clientes" },
        { name: "Control Turnos (Interno)", url: "https://sistemadigital.github.io/consultas-turnos/interno" },
        { name: "Asignación Clientes", url: "https://sistemadigital.github.io/consultas-turnos/asignados" },
        { name: "Resguardo de Datos", url: "https://sistemadigital.github.io/resguardo/" },
        { name: "Causas Asignadas", url: "https://admindefensoria6.github.io/rf-causas/" },
        { name: "Agenda Defensor (sistema)", url: "https://defensorialocal-seis.github.io/agenda/" },
        { name: "Agenda Defensor (celular)", url: "https://defensorialocal-seis.github.io/agenda/ramos" },
        { isHeader: true, name: "Rómulo Fioravante" },
        { name: "Agenda Laboral 6 (celular)", url: "https://app-fioravante.github.io/agenda-laboral/" },
        { isHeader: true, name: "Secretarios" },
        { name: "Dra. Riveros", url: "https://sistema-secretarios.github.io/dra-riveros/" },
        { name: "Dra. Corrales", url: "https://sistema-secretarios.github.io/dra-corrales/" },
        { name: "Dr. Magnani", url: "https://sistema-secretarios.github.io/dr-magnani/" }
      ]
    },
    {
      title: "Finanza Hogar",
      icon: "fa-chart-line",
      desc: "Control de finanzas y gastos familiares.",
      color: "#15803d",
      links: [
        { name: "Ir a Finanzas", url: "https://app-fioravante.github.io/finanzas/" },
        { name: "Mi Garrafa", url: "https://experiencia-ia.github.io/Mi-garrafa/" }
      ]
    },
    {
      title: "Despensa Hogar",
      icon: "fa-cart-shopping",
      desc: "Inventario y stock de la despensa.",
      color: "#a16207",
      links: [{ name: "Ir a Despensa", url: "https://app-fioravante.github.io/stock-hogar/" }]
    },
    {
      title: "Farmacia Hogar",
      icon: "fa-capsules",
      desc: "Control de medicamentos del hogar.",
      color: "#6d28d9",
      links: [{ name: "Ir a Farmacia", url: "https://app-fioravante.github.io/medicamentos-hogar/" }]
    },
    {
      title: "Biblia",
      icon: "fa-bible",
      desc: "Lectura bíblica y cronología histórica.",
      color: "#0e7490",
      links: [
        { name: "Web Estudios Biblia", url: "https://app-fioravante.github.io/appbiblia/webbiblia" },
        { name: "Ir a Biblia", url: "https://app-fioravante.github.io/appbiblia/" },
        { name: "Ir a Cronología Biblia Historia", url: "https://experiencia-ia.github.io/crono-bibliahistoria/" }
      ]
    },
    {
      title: "Astronomía",
      icon: "fa-moon",
      desc: "Recursos y guías de astronomía.",
      color: "#be185d",
      links: [{ name: "Ir a Astroamigos", url: "https://app-fioravante.github.io/astroamigos-misiones/" }]
    },
    {
      title: "Genealogía",
      icon: "fa-tree",
      desc: "Árbol genealógico familiar.",
      color: "#c2410c",
      links: [{ name: "Ir a Familia", url: "https://app-fioravante.github.io/familiia/" }]
    },
    {
      title: "Otros",
      icon: "fa-shapes",
      desc: "Variedad de materias y temas.",
      color: "#475569",
      links: [
        { name: "Certificados de Capacitacion Judicial", url: "https://app-fioravante.github.io/apps-fioravante/certificados-capacitacion" },
        { name: "Enciclopedia Visual Digital", url: "https://app-fioravante.github.io/apps-fioravante/enciclopedia" }
      ]
    }
  ];

  modules.forEach((m, mi) => {
    let cur = { name: null, items: [] };
    m.groups = [cur];
    m.links.forEach(l => {
      if (l.isHeader) { cur = { name: l.name, items: [] }; m.groups.push(cur); }
      else cur.items.push({ name: l.name, url: l.url, group: cur.name, mod: mi });
    });
    m.groups = m.groups.filter(g => g.items.length);
    m.count = m.groups.reduce((n, g) => n + g.items.length, 0);
  });
  const allLinks = modules.flatMap(m => m.groups.flatMap(g => g.items));
  const byUrl = new Map(allLinks.map(l => [l.url, l]));

  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const accesos = n => n + (n === 1 ? ' acceso' : ' accesos');

  const home = $('home'), areas = $('areas'), bar = $('bar'), sel = $('sel'), backBtn = $('backBtn');
  const detail = $('detail'), dBody = $('dBody'), dFilter = $('dFilter'), dFilterWrap = $('dFilterWrap');
  const q = $('q'), clearBtn = $('clearBtn'), recentsEl = $('recents');
  const results = $('results'), resultsBody = $('resultsBody'), resultsMeta = $('resultsMeta');

  /* Saludo y reloj */
  function tick() {
    const d = new Date(), h = d.getHours();
    const g = (h < 6 ? 'Buenas noches' : h < 13 ? 'Buen día' : h < 20 ? 'Buenas tardes' : 'Buenas noches') + ', Rómulo';
    const t = d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
    const f = t.charAt(0).toUpperCase() + t.slice(1);
    if ($('greeting').textContent !== g) $('greeting').textContent = g;
    if ($('heroDate').textContent !== f) $('heroDate').textContent = f;
    rfSky();
  }
  q.placeholder = 'Buscar entre ' + accesos(allLinks.length);

  /* Módulos: mismo formato que las áreas de Rf */
  areas.innerHTML = modules.map((m, i) => `<li class="fade${i % 2 ? '' : ' b'}" style="--i:${(2 + i * 0.25).toFixed(2)}"><button type="button" data-mod="${i}"><span>${esc(m.title)}</span></button></li>`).join('');

  const rowHTML = (l, label, sub) => `<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener" data-url="${esc(l.url)}"><span class="row-main"><span class="row-name">${label}</span>${sub ? `<span class="row-sub">${esc(sub)}</span>` : ''}</span><span class="go" aria-hidden="true">&#8599;&#xFE0E;</span></a>`;

  /* Apertura de un módulo: el título sube a la barra y aparecen sus accesos */
  let picked = null;
  const pause = ms => new Promise(r => setTimeout(r, ms));
  const snap = el => el.getBoundingClientRect();
  function fly(el, from, to, ms) {
    el.style.transformOrigin = 'top left';
    el.style.transition = 'none';
    el.style.transform = `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width})`;
    void el.offsetWidth;
    el.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1)`;
    el.style.transform = 'none';
  }

  function fillDetail(m) {
    $('dDesc').textContent = m.desc;
    dBody.innerHTML = m.groups.map(g => `<section class="group">${g.name ? `<h3 class="gt">${esc(g.name)}</h3>` : ''}<div class="list">${g.items.map(l => rowHTML(l, esc(l.name))).join('')}</div></section>`).join('');
    dFilter.value = '';
    dFilterWrap.hidden = m.count <= 8;
    $('dEmpty').hidden = true;
  }
  dFilter.addEventListener('input', () => {
    const term = norm(dFilter.value.trim());
    let shown = 0;
    dBody.querySelectorAll('.group').forEach(g => {
      let any = false;
      g.querySelectorAll('.row').forEach(r => {
        const ok = !term || norm(r.textContent).includes(term);
        r.hidden = !ok;
        if (ok) { any = true; shown++; }
      });
      g.hidden = !any;
    });
    $('dEmpty').hidden = shown > 0;
  });

  async function openArea(btn) {
    if (picked) return;
    picked = btn;
    const m = modules[+btn.dataset.mod], li = btn.parentElement;
    sel.textContent = m.title;
    sel.classList.toggle('b', li.classList.contains('b'));
    fillDetail(m);
    li.classList.add('picked');
    home.classList.add('leaving');
    if (!reduce) await pause(320);
    const from = snap(btn.firstElementChild);
    reveal.classList.add('open');
    if (!reduce) fly(sel, from, snap(sel), 850);
    await pause(reduce ? 0 : 500);
    bar.classList.add('ready');
    detail.classList.add('in');
    backBtn.focus({ preventScroll: true });
  }

  async function closeArea() {
    if (!picked) return;
    const btn = picked, text = btn.firstElementChild;
    bar.classList.remove('ready');
    detail.classList.remove('in');
    if (!reduce) await pause(320);
    const from = snap(sel);
    reveal.classList.remove('open');
    void home.offsetWidth;
    if (!reduce) fly(text, from, snap(text), 850);
    home.classList.remove('leaving');
    btn.parentElement.classList.remove('picked');
    picked = null;
    btn.focus({ preventScroll: true });
  }

  areas.addEventListener('click', e => {
    const b = e.target.closest('button[data-mod]');
    if (b) openArea(b);
  });
  backBtn.addEventListener('click', closeArea);

  /* Recientes */
  const RKEY = 'rf-recientes';
  const getRecents = () => { try { return JSON.parse(localStorage.getItem(RKEY) || '[]').filter(u => byUrl.has(u)); } catch (e) { return []; } };
  function pushRecent(url) {
    try {
      const a = getRecents().filter(u => u !== url);
      a.unshift(url);
      localStorage.setItem(RKEY, JSON.stringify(a.slice(0, 6)));
    } catch (e) {}
  }
  function renderRecents() {
    const list = getRecents();
    recentsEl.hidden = !list.length || !!q.value.trim();
    recentsEl.innerHTML = list.length
      ? '<span class="rl">Recientes</span>' + list.map(u => `<a class="chip" href="${esc(u)}" target="_blank" rel="noopener" data-url="${esc(u)}">${esc(byUrl.get(u).name)}</a>`).join('') + '<button type="button" class="link" data-clear>Borrar</button>'
      : '';
  }
  recentsEl.addEventListener('click', e => {
    if (e.target.closest('[data-clear]')) { try { localStorage.removeItem(RKEY); } catch (err) {} renderRecents(); }
  });
  const track = e => {
    const a = e.target.closest('a[data-url]');
    if (a) { pushRecent(a.dataset.url); setTimeout(renderRecents, 150); }
  };
  document.addEventListener('click', track);
  document.addEventListener('auxclick', e => { if (e.button === 1) track(e); });

  /* Búsqueda */
  function mark(text, tokens) {
    const n = norm(text), ranges = [];
    tokens.forEach(t => {
      let i = n.indexOf(t);
      while (i !== -1) { ranges.push([i, i + t.length]); i = n.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (let k = 1; k < ranges.length; k++) {
      const last = merged[merged.length - 1];
      if (ranges[k][0] <= last[1]) last[1] = Math.max(last[1], ranges[k][1]);
      else merged.push(ranges[k].slice());
    }
    let out = '', pos = 0;
    merged.forEach(([a, b]) => { out += esc(text.slice(pos, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; pos = b; });
    return out + esc(text.slice(pos));
  }

  function runSearch(raw) {
    const tokens = norm(raw).split(/\s+/).filter(Boolean);
    const hits = allLinks.filter(l => {
      const hay = norm(l.name + ' ' + modules[l.mod].title + ' ' + (l.group || ''));
      return tokens.every(t => hay.includes(t));
    });
    if (!hits.length) {
      resultsMeta.textContent = '';
      resultsBody.innerHTML = `<p class="empty">Sin resultados para «${esc(raw)}». <button type="button" class="link" id="emptyClear">Borrar búsqueda</button></p>`;
      $('emptyClear').addEventListener('click', clearSearch);
      return;
    }
    resultsMeta.textContent = hits.length + (hits.length === 1 ? ' resultado' : ' resultados');
    const byMod = new Map();
    hits.forEach(l => { if (!byMod.has(l.mod)) byMod.set(l.mod, []); byMod.get(l.mod).push(l); });
    resultsBody.innerHTML = [...byMod.entries()].map(([mi, items]) =>
      `<section class="group"><h3 class="gt">${esc(modules[mi].title)}</h3><div class="list">${items.map(l => rowHTML(l, mark(l.name, tokens), l.group)).join('')}</div></section>`).join('');
  }

  function onQuery() {
    const v = q.value.trim();
    clearBtn.hidden = !q.value;
    areas.hidden = !!v;
    results.hidden = !v;
    if (v) { recentsEl.hidden = true; runSearch(v); } else renderRecents();
  }
  function clearSearch() { q.value = ''; onQuery(); q.focus(); }
  q.addEventListener('input', onQuery);
  clearBtn.addEventListener('click', clearSearch);
  q.addEventListener('keydown', e => {
    const first = results.hidden ? null : results.querySelector('.row');
    if (e.key === 'ArrowDown' && first) { e.preventDefault(); first.focus(); }
    else if (e.key === 'Enter' && first) { e.preventDefault(); first.click(); }
  });
  results.addEventListener('keydown', e => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const rows = [...results.querySelectorAll('.row')], i = rows.indexOf(document.activeElement);
    if (i === -1) return;
    e.preventDefault();
    if (e.key === 'ArrowDown') rows[Math.min(i + 1, rows.length - 1)].focus();
    else (i === 0 ? q : rows[i - 1]).focus();
  });

  /* Teclado global */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (picked) closeArea();
      else if (document.activeElement === q && q.value) { q.value = ''; onQuery(); }
      return;
    }
    if (picked || !reveal.classList.contains('show')) return;
    const el = document.activeElement;
    const typing = el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
    if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
      e.preventDefault(); q.focus(); q.select();
    }
  });

  renderRecents();
  tick();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', tick);

  run();
})();
</script>
