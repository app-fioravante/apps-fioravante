<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Repositorio de aplicaciones de Rómulo Fioravante: accesos personales, laborales y del hogar en un solo lugar.">
<meta name="theme-color" content="#f2f4f8">
<title>Rómulo Fioravante App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
  /* Tema aplicado antes de pintar para evitar el destello */
  (function(){
    var t;
    try { t = localStorage.getItem('rf-theme'); } catch(e) {}
    if (t !== 'dark' && t !== 'light') {
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root{
    color-scheme:light;
    --bg:#f2f4f8;
    --surface:#ffffff;
    --surface-2:#f5f7fb;
    --line:#e0e5ee;
    --line-strong:#ccd4e1;
    --ink:#0c1424;
    --ink-2:#47536b;
    --ink-3:#76829a;
    --focus:#2f5bd8;
    --mark-bg:#1e3a8a;
    --tile-mix:11%;
    --lift:0%;
    --shadow-pop:0 40px 80px -28px rgba(12,20,36,.38);
    --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
    --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --gutter:clamp(16px,4vw,32px);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#080c17;
    --surface:#10172a;
    --surface-2:#161f37;
    --line:#212b45;
    --line-strong:#2f3d5f;
    --ink:#eaf0fb;
    --ink-2:#a2b0cc;
    --ink-3:#7585a6;
    --focus:#7f9bff;
    --mark-bg:#3558d6;
    --tile-mix:24%;
    --lift:50%;
    --shadow-pop:0 40px 80px -24px rgba(0,0,0,.7);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  [hidden]{display:none!important;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--body);
    font-size:16px;
    line-height:1.5;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden;}
  button,input{font:inherit;color:inherit;}
  button{cursor:pointer;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .wrap{max-width:1120px;margin:0 auto;padding-inline:var(--gutter);}

  /* Cada elemento que lleva el color de un módulo declara --accent en línea */
  .tinted{
    --accent-fg:color-mix(in srgb, white var(--lift), var(--accent));
    --tile:color-mix(in srgb, var(--accent) var(--tile-mix), var(--surface));
  }

  .skip{
    position:absolute;left:12px;top:-64px;z-index:100;
    background:var(--ink);color:var(--bg);
    padding:10px 14px;border-radius:10px;
    font-weight:600;text-decoration:none;
    transition:top .15s ease;
  }
  .skip:focus{top:12px;}

  /* Barra superior */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 84%, transparent);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);
    backdrop-filter:saturate(1.4) blur(14px);
  }
  .topbar-in{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;height:68px;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .mark{
    width:40px;height:40px;flex-shrink:0;
    display:grid;place-items:center;
    border-radius:12px;
    background:var(--mark-bg);color:#fff;
    font-family:var(--display);font-weight:800;font-size:.95rem;
  }
  .brand-text{min-width:0;}
  .brand-name{
    font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.2;
    white-space:nowrap;
  }
  .brand-name span{color:var(--ink-3);font-weight:500;margin-left:6px;}
  .brand-sub{
    font-size:.8rem;color:var(--ink-2);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .icon-btn{
    width:40px;height:40px;flex-shrink:0;
    display:grid;place-items:center;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-2);
    transition:color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{color:var(--ink);border-color:var(--line-strong);}

  /* Portada */
  .hero{padding-top:clamp(32px,6vw,64px);}
  .hero-date{
    font-size:.9rem;color:var(--ink-3);
    font-variant-numeric:tabular-nums;
    margin-bottom:10px;
  }
  .hero h1{
    font-family:var(--display);font-weight:700;
    font-size:clamp(2.1rem,5.4vw,3.6rem);
    line-height:1.04;letter-spacing:-.025em;
    font-optical-sizing:auto;
  }
  .hero-sub{margin-top:12px;color:var(--ink-2);max-width:48ch;}

  .search{position:relative;margin-top:26px;max-width:640px;}
  .search input{
    width:100%;height:58px;
    padding:0 96px 0 52px;
    border-radius:18px;
    border:1px solid var(--line-strong);
    background:var(--surface);
    font-size:1.02rem;
    outline:none;
    -webkit-appearance:none;appearance:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search input::placeholder{color:var(--ink-3);}
  .search input::-webkit-search-cancel-button{display:none;}
  .search input:focus{
    border-color:var(--focus);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--focus) 22%, transparent);
  }
  .search .ico{
    position:absolute;left:20px;top:50%;transform:translateY(-50%);
    color:var(--ink-3);pointer-events:none;
  }
  .search kbd{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    min-width:26px;height:26px;padding:0 8px;
    display:grid;place-items:center;
    font:600 .78rem var(--body);
    color:var(--ink-3);
    border:1px solid var(--line-strong);border-radius:8px;
    background:var(--surface-2);
    pointer-events:none;
  }
  .search.has-value kbd{display:none;}
  .search .clear{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border:0;border-radius:11px;
    background:transparent;color:var(--ink-3);
  }
  .search .clear:hover{background:var(--surface-2);color:var(--ink);}
  @media (hover:none){.search kbd{display:none;}}

  /* Secciones */
  main{padding-bottom:8px;}
  .section{margin-top:clamp(28px,4.5vw,44px);}
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;margin-bottom:14px;
  }
  .section-head h2{
    font-family:var(--display);font-weight:700;
    font-size:1.2rem;letter-spacing:-.01em;
  }
  .section-head p{font-size:.84rem;color:var(--ink-3);}
  .link-btn{
    background:none;border:0;padding:2px 0;
    font-size:.84rem;color:var(--ink-3);
    text-decoration:underline;text-underline-offset:3px;
  }
  .link-btn:hover{color:var(--ink);}

  /* Recientes */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    display:inline-flex;align-items:center;gap:9px;
    max-width:100%;
    padding:6px 15px 6px 6px;
    border-radius:999px;
    background:var(--surface);
    border:1px solid var(--line);
    text-decoration:none;font-size:.88rem;font-weight:500;
    transition:border-color .15s ease;
  }
  .chip:hover{border-color:color-mix(in srgb, var(--accent) 50%, var(--line));}
  .chip-ico{
    width:28px;height:28px;flex-shrink:0;
    display:grid;place-items:center;
    border-radius:50%;
    background:var(--tile);color:var(--accent-fg);
    font-size:.72rem;
  }
  .chip-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Módulos */
  .grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
  }
  .card{
    display:flex;flex-direction:column;
    min-height:184px;
    padding:20px;
    text-align:left;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    animation:enter .5s ease both;
    animation-delay:calc(var(--i) * 40ms);
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:color-mix(in srgb, var(--accent) 50%, var(--line));
    box-shadow:0 22px 34px -26px color-mix(in srgb, var(--accent) 85%, transparent);
  }
  .card:focus-visible{outline:2px solid var(--accent-fg);outline-offset:3px;}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .tile{
    width:46px;height:46px;flex-shrink:0;
    display:grid;place-items:center;
    border-radius:14px;
    background:var(--tile);color:var(--accent-fg);
    font-size:1.05rem;
    transition:background .2s ease, color .2s ease;
  }
  .card:hover .tile{background:var(--accent);color:#fff;}
  .count{
    padding:3px 10px;
    font-size:.78rem;font-weight:500;color:var(--ink-2);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:999px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .card-title{
    display:block;margin-top:18px;
    font-family:var(--display);font-weight:700;
    font-size:1.14rem;line-height:1.25;letter-spacing:-.01em;
  }
  .desc{
    display:block;margin-top:5px;flex:1;
    font-size:.88rem;line-height:1.45;color:var(--ink-2);
  }
  @keyframes enter{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:none;}
  }

  /* Listas agrupadas (ventana de módulo y resultados) */
  .group + .group{margin-top:18px;}
  .group-title{
    display:flex;align-items:center;gap:8px;
    margin:0 4px 8px;
    font-family:var(--display);font-weight:700;font-size:.92rem;
    color:var(--accent-fg, var(--ink));
  }
  .group-title i{font-size:.8rem;}
  .list{
    display:flex;flex-direction:column;gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:13px 16px;
    background:var(--surface);
    text-decoration:none;font-weight:500;font-size:.94rem;
    transition:background .12s ease;
  }
  .row:hover{background:var(--surface-2);}
  .row:focus-visible{outline-offset:-2px;background:var(--surface-2);}
  .row i{
    flex-shrink:0;font-size:.76rem;color:var(--ink-3);
    transition:color .15s ease, transform .15s ease;
  }
  .row:hover i{color:var(--accent-fg, var(--ink));transform:translate(1px,-1px);}
  .row-main{display:flex;flex-direction:column;min-width:0;}
  .row-sub{font-size:.78rem;font-weight:400;color:var(--ink-3);}
  mark{
    background:color-mix(in srgb, var(--accent, var(--focus)) 28%, transparent);
    color:inherit;border-radius:3px;padding:0 1px;
  }

  .results{max-width:760px;}
  .empty{
    padding:36px 20px;text-align:center;color:var(--ink-2);
    background:var(--surface);
    border:1px dashed var(--line-strong);
    border-radius:18px;
  }
  .empty i{font-size:1.4rem;color:var(--ink-3);margin-bottom:10px;}
  .empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:2px;}
  .empty-note{padding:22px 8px;text-align:center;color:var(--ink-3);font-size:.9rem;}

  footer{
    padding:40px 0 48px;
    text-align:center;font-size:.82rem;color:var(--ink-3);
  }

  /* Ventana de módulo */
  .overlay{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    background:rgba(6,10,20,.52);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    opacity:0;visibility:hidden;
    transition:opacity .22s ease, visibility 0s linear .22s;
  }
  .overlay.open{opacity:1;visibility:visible;transition:opacity .22s ease;}
  .sheet{
    width:100%;max-width:520px;
    max-height:min(84vh,760px);
    max-height:min(84dvh,760px);
    display:flex;flex-direction:column;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:var(--shadow-pop);
    overflow:hidden;
    transform:translateY(14px) scale(.98);
    transition:transform .26s cubic-bezier(.2,.8,.2,1);
  }
  .overlay.open .sheet{transform:none;}
  .sheet-head{display:flex;align-items:flex-start;gap:14px;padding:20px 20px 18px;}
  .sheet-head .tile{width:48px;height:48px;background:var(--accent);color:#fff;}
  .sheet-titles{flex:1;min-width:0;}
  .sheet-titles h2{
    font-family:var(--display);font-weight:700;
    font-size:1.3rem;line-height:1.2;letter-spacing:-.015em;
  }
  .sheet-titles p{margin-top:3px;font-size:.86rem;color:var(--ink-2);}
  .sheet-titles .sheet-count{margin-top:6px;font-size:.8rem;color:var(--ink-3);}
  .sheet-filter{position:relative;padding:0 16px 14px;}
  .sheet-filter input{
    width:100%;height:42px;
    padding:0 14px 0 38px;
    border-radius:12px;
    border:1px solid var(--line-strong);
    background:var(--surface-2);
    font-size:.92rem;outline:none;
    -webkit-appearance:none;appearance:none;
  }
  .sheet-filter input::-webkit-search-cancel-button{display:none;}
  .sheet-filter input:focus{border-color:var(--focus);}
  .sheet-filter i{
    position:absolute;left:30px;top:21px;transform:translateY(-50%);
    font-size:.82rem;color:var(--ink-3);pointer-events:none;
  }
  .sheet-body{
    flex:1;overflow-y:auto;
    padding:16px 16px 22px;
    border-top:1px solid var(--line);
    overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;
  }

  @media (max-width:640px){
    .topbar-in{height:60px;}
    .brand-sub{display:none;}
    .search input{height:54px;}
    .grid{gap:8px;}
    .card{min-height:0;padding:12px;border-radius:16px;}
    .tile{width:36px;height:36px;border-radius:11px;font-size:.9rem;}
    .count{padding:2px 8px;font-size:.72rem;}
    .count-label{display:none;}
    .card-title{margin-top:12px;font-size:.88rem;}
    .desc{display:none;}
    .chips{
      flex-wrap:nowrap;overflow-x:auto;
      margin-inline:calc(var(--gutter) * -1);
      padding-inline:var(--gutter);
      scrollbar-width:none;
    }
    .chips::-webkit-scrollbar{display:none;}
    .chip{flex-shrink:0;}
    .overlay{align-items:flex-end;padding:0;}
    .sheet{
      max-width:none;max-height:88vh;max-height:88dvh;
      border-radius:24px 24px 0 0;
      border-bottom:0;
      transform:translateY(100%);
    }
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{transition-duration:.01ms!important;animation:none!important;}
  }
</style>
</head>
<body>

<a class="skip" href="#modulos">Ir a los módulos</a>

<div id="page">
  <header class="topbar">
    <div class="wrap topbar-in">
      <div class="brand">
        <div class="mark" aria-hidden="true">RF</div>
        <div class="brand-text">
          <div class="brand-name">App Web SPA <span>2025–2026</span></div>
          <div class="brand-sub">Repositorio de aplicaciones de Rómulo Fioravante</div>
        </div>
      </div>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Cambiar tema"></button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-labelledby="greeting">
      <p class="hero-date" id="heroDate"></p>
      <h1 id="greeting">Hola, Rómulo</h1>
      <p class="hero-sub" id="heroSub"></p>

      <div class="search" id="searchBox" role="search">
        <i class="fas fa-magnifying-glass ico" aria-hidden="true"></i>
        <input type="search" id="q" placeholder="Buscar app o sistema" aria-label="Buscar app o sistema" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <kbd aria-hidden="true">/</kbd>
        <button type="button" class="clear" id="clearBtn" aria-label="Borrar búsqueda" hidden><i class="fas fa-xmark" aria-hidden="true"></i></button>
      </div>
    </section>

    <section class="section" id="recents" aria-labelledby="recentsTitle" hidden>
      <div class="section-head">
        <h2 id="recentsTitle">Recientes</h2>
        <button type="button" class="link-btn" id="clearRecents">Borrar</button>
      </div>
      <div class="chips" id="chips"></div>
    </section>

    <section class="section" id="modulos" aria-labelledby="modulesTitle">
      <div class="section-head">
        <h2 id="modulesTitle">Módulos</h2>
        <p id="pageMeta"></p>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="section results" id="results" aria-labelledby="resultsTitle" hidden>
      <div class="section-head">
        <h2 id="resultsTitle">Resultados</h2>
        <p id="resultsMeta" aria-live="polite"></p>
      </div>
      <div id="resultsBody"></div>
    </section>
  </main>

  <footer>&copy; 2025–2026 Rómulo Fioravante</footer>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="sheet tinted" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <div class="tile" id="sheetTile" aria-hidden="true"></div>
      <div class="sheet-titles">
        <h2 id="sheetTitle"></h2>
        <p id="sheetDesc"></p>
        <p class="sheet-count" id="sheetCount"></p>
      </div>
      <button type="button" class="icon-btn" id="sheetClose" aria-label="Cerrar"><i class="fas fa-xmark" aria-hidden="true"></i></button>
    </div>
    <div class="sheet-filter" id="sheetFilterWrap" hidden>
      <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
      <input type="search" id="sheetFilter" placeholder="Filtrar accesos" aria-label="Filtrar accesos de este módulo" autocomplete="off" spellcheck="false">
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
  const modules = [
    {
      title: "Personal",
      icon: "fa-user",
      desc: "Peso, alquiler de vivienda y recibos de sueldo.",
      color: "#be123c",
      links: [
        { name: "Peso Corporal", url: "https://app-fioravante.github.io/peso-corporal/" },
        { name: "Alquiler Vivienda", url: "https://app-fioravante.github.io/alquiler-vivienda/" },
        { name: "Recibos de Sueldo", url: "https://app-fioravante.github.io/apps-fioravante/recibos" }
      ]
    },
    {
      title: "Laboral",
      icon: "fa-briefcase",
      desc: "Sistemas y accesos del ámbito de trabajo.",
      color: "#1d4ed8",
      links: [
        { name: "Sistema Defensor-Secretarios", url: "https://sistemadigital.github.io/defensor-secretarios/" },
        { name: "Sistema Empleados", url: "https://sistemadigital.github.io/empleados/" },
        { name: "Sistema Operador y Atención", url: "https://defensoria6.github.io/operador-defensoria/" },
        { name: "Control Inasistencia-Licencias", url: "https://defensorialocal-seis.github.io/faltas-licencias/" },
        { name: "Estadística Digital", url: "https://defensoria6.github.io/reporte/" },
        { name: "Clientes y Turnos (Público)", url: "https://sistemadigital.github.io/consultas-turnos/clientes" },
        { name: "Control Turnos (Interno)", url: "https://sistemadigital.github.io/consultas-turnos/interno" },
        { name: "Asignación Clientes", url: "https://sistemadigital.github.io/consultas-turnos/asignados" },
        { name: "Resguardo de Datos", url: "https://sistemadigital.github.io/resguardo/" },
        { name: "Causas Asignadas", url: "https://admindefensoria6.github.io/rf-causas/" },
        { name: "Agenda Defensor (sistema)", url: "https://defensorialocal-seis.github.io/agenda/" },
        { name: "Agenda Defensor (celular)", url: "https://defensorialocal-seis.github.io/agenda/ramos" },
        { isHeader: true, name: "Rómulo Fioravante" },
        { name: "Agenda Laboral 6 (celular)", url: "https://app-fioravante.github.io/agenda-laboral/" },
        { isHeader: true, name: "Secretarios" },
        { name: "Dra. Riveros", url: "https://sistema-secretarios.github.io/dra-riveros/" },
        { name: "Dra. Corrales", url: "https://sistema-secretarios.github.io/dra-corrales/" },
        { name: "Dr. Magnani", url: "https://sistema-secretarios.github.io/dr-magnani/" }
      ]
    },
    {
      title: "Finanza Hogar",
      icon: "fa-chart-line",
      desc: "Control de finanzas y gastos familiares.",
      color: "#15803d",
      links: [
        { name: "Ir a Finanzas", url: "https://app-fioravante.github.io/finanzas/" },
        { name: "Mi Garrafa", url: "https://experiencia-ia.github.io/Mi-garrafa/" }
      ]
    },
    {
      title: "Despensa Hogar",
      icon: "fa-cart-shopping",
      desc: "Inventario y stock de la despensa.",
      color: "#a16207",
      links: [{ name: "Ir a Despensa", url: "https://app-fioravante.github.io/stock-hogar/" }]
    },
    {
      title: "Farmacia Hogar",
      icon: "fa-capsules",
      desc: "Control de medicamentos del hogar.",
      color: "#6d28d9",
      links: [{ name: "Ir a Farmacia", url: "https://app-fioravante.github.io/medicamentos-hogar/" }]
    },
    {
      title: "Biblia",
      icon: "fa-bible",
      desc: "Lectura bíblica y cronología histórica.",
      color: "#0e7490",
      links: [
        { name: "Web Estudios Biblia", url: "https://app-fioravante.github.io/appbiblia/webbiblia" },
        { name: "Ir a Biblia", url: "https://app-fioravante.github.io/appbiblia/" },
        { name: "Ir a Cronología Biblia Historia", url: "https://experiencia-ia.github.io/crono-bibliahistoria/" }
      ]
    },
    {
      title: "Astronomía",
      icon: "fa-moon",
      desc: "Recursos y guías de astronomía.",
      color: "#be185d",
      links: [{ name: "Ir a Astroamigos", url: "https://app-fioravante.github.io/astroamigos-misiones/" }]
    },
    {
      title: "Genealogía",
      icon: "fa-tree",
      desc: "Árbol genealógico familiar.",
      color: "#c2410c",
      links: [{ name: "Ir a Familia", url: "https://app-fioravante.github.io/familiia/" }]
    },
    {
      title: "Otros",
      icon: "fa-shapes",
      desc: "Malvinas, telescopio, comidas, religiones y oficios del hogar.",
      color: "#475569",
      links: [
        { name: "Malvinas", url: "https://app-fioravante.github.io/apps-fioravante/malvinas" },
        { name: "Telescopio", url: "https://app-fioravante.github.io/apps-fioravante/telescopio" },
        { name: "Finanzas", url: "https://app-fioravante.github.io/apps-fioravante/finanzas" },
        { name: "Comida saludable", url: "https://app-fioravante.github.io/apps-fioravante/comida" },
        { name: "Religiones del Mundo", url: "https://app-fioravante.github.io/apps-fioravante/religiones" },
        { name: "Redes Informáticas", url: "https://app-fioravante.github.io/apps-fioravante/redes" },
        { name: "Albañilería y Pintura", url: "https://app-fioravante.github.io/apps-fioravante/albañileria" },
        { name: "Plomería", url: "https://app-fioravante.github.io/apps-fioravante/plomeria" },
        { name: "Electricidad", url: "https://app-fioravante.github.io/apps-fioravante/electricidad" }
      ]
    }
  ];

  /* ---------- Datos derivados ---------- */
  modules.forEach((m, mi) => {
    let cur = { name: null, items: [] };
    m.groups = [cur];
    m.links.forEach(l => {
      if (l.isHeader) { cur = { name: l.name, items: [] }; m.groups.push(cur); }
      else cur.items.push({ name: l.name, url: l.url, group: cur.name, mod: mi });
    });
    m.groups = m.groups.filter(g => g.items.length);
    m.count = m.groups.reduce((s, g) => s + g.items.length, 0);
  });
  const allLinks = modules.flatMap(m => m.groups.flatMap(g => g.items));
  const byUrl = new Map(allLinks.map(l => [l.url, l]));

  /* ---------- Utilidades ---------- */
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const accesos = n => n + (n === 1 ? ' acceso' : ' accesos');

  const page = $('page'), grid = $('grid'), q = $('q'), searchBox = $('searchBox'), clearBtn = $('clearBtn');
  const recentsSec = $('recents'), chips = $('chips'), modulesSec = $('modulos');
  const resultsSec = $('results'), resultsBody = $('resultsBody'), resultsMeta = $('resultsMeta');
  const overlay = $('overlay'), sheet = $('sheet'), sheetBody = $('sheetBody');
  const sheetFilterWrap = $('sheetFilterWrap'), sheetFilter = $('sheetFilter');

  /* ---------- Tema ---------- */
  const root = document.documentElement;
  const themeBtn = $('themeBtn');
  function setTheme(t, save){
    root.setAttribute('data-theme', t);
    themeBtn.innerHTML = '<i class="fas ' + (t === 'dark' ? 'fa-sun' : 'fa-moon') + '" aria-hidden="true"></i>';
    themeBtn.setAttribute('aria-label', t === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#080c17' : '#f2f4f8');
    if (save) { try { localStorage.setItem('rf-theme', t); } catch (e) {} }
  }
  themeBtn.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true));
  setTheme(root.getAttribute('data-theme') || 'light', false);

  /* ---------- Saludo y reloj ---------- */
  function tick(){
    const d = new Date(), h = d.getHours();
    const saludo = h < 6 ? 'Buenas noches' : h < 13 ? 'Buen día' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
    $('greeting').textContent = saludo + ', Rómulo';
    const fecha = d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
    const hora = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
    const s = fecha + ', ' + hora;
    $('heroDate').textContent = s.charAt(0).toUpperCase() + s.slice(1);
  }

  /* ---------- Módulos ---------- */
  function renderGrid(){
    grid.innerHTML = modules.map((m, i) => `
      <button type="button" class="card tinted" style="--accent:${m.color};--i:${i}" data-mod="${i}" aria-haspopup="dialog">
        <span class="card-top">
          <span class="tile"><i class="fas ${m.icon}" aria-hidden="true"></i></span>
          <span class="count"><b>${m.count}</b><span class="count-label"> ${m.count === 1 ? 'acceso' : 'accesos'}</span></span>
        </span>
        <span class="card-title">${esc(m.title)}</span>
        <span class="desc">${esc(m.desc)}</span>
      </button>`).join('');
    $('pageMeta').textContent = modules.length + ' módulos, ' + accesos(allLinks.length);
    $('heroSub').textContent = 'Busca entre ' + accesos(allLinks.length) + ' o abre un módulo.';
  }

  const rowHTML = (l, label, sub) => `
    <a class="row" href="${esc(l.url)}" target="_blank" rel="noopener" data-url="${esc(l.url)}">
      <span class="row-main"><span class="row-name">${label}</span>${sub ? `<span class="row-sub">${esc(sub)}</span>` : ''}</span>
      <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
    </a>`;

  /* ---------- Ventana de módulo ---------- */
  let lastOpener = null;
  const sheetOpen = () => overlay.classList.contains('open');

  function openSheet(i, opener){
    const m = modules[i];
    lastOpener = opener || null;
    sheet.style.setProperty('--accent', m.color);
    $('sheetTile').innerHTML = `<i class="fas ${m.icon}"></i>`;
    $('sheetTitle').textContent = m.title;
    $('sheetDesc').textContent = m.desc;
    $('sheetCount').textContent = accesos(m.count);
    sheetBody.innerHTML = m.groups.map(g => `
      <section class="group">
        ${g.name ? `<h3 class="group-title">${esc(g.name)}</h3>` : ''}
        <div class="list">${g.items.map(l => rowHTML(l, esc(l.name))).join('')}</div>
      </section>`).join('') + '<p class="empty-note" id="sheetEmpty" hidden>Ningún acceso coincide con ese nombre.</p>';
    sheetFilter.value = '';
    sheetFilterWrap.hidden = m.count <= 8;
    sheetBody.scrollTop = 0;

    page.inert = true;
    document.body.classList.add('locked');
    overlay.setAttribute('aria-hidden', 'false');
    overlay.classList.add('open');
    setTimeout(() => $('sheetClose').focus(), 30);
  }

  function closeSheet(){
    if (!sheetOpen()) return;
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    page.inert = false;
    document.body.classList.remove('locked');
    if (lastOpener && document.contains(lastOpener)) lastOpener.focus();
    lastOpener = null;
  }

  sheetFilter.addEventListener('input', () => {
    const term = norm(sheetFilter.value.trim());
    let shown = 0;
    sheetBody.querySelectorAll('.group').forEach(g => {
      let any = false;
      g.querySelectorAll('.row').forEach(r => {
        const ok = !term || norm(r.textContent).includes(term);
        r.hidden = !ok;
        if (ok) { any = true; shown++; }
      });
      g.hidden = !any;
    });
    $('sheetEmpty').hidden = shown > 0;
  });

  grid.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (card) openSheet(+card.dataset.mod, card);
  });
  $('sheetClose').addEventListener('click', closeSheet);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });

  /* ---------- Recientes ---------- */
  const RKEY = 'rf-recientes';
  function getRecents(){
    try { return (JSON.parse(localStorage.getItem(RKEY) || '[]')).filter(u => byUrl.has(u)); }
    catch (e) { return []; }
  }
  function pushRecent(url){
    try {
      const a = getRecents().filter(u => u !== url);
      a.unshift(url);
      localStorage.setItem(RKEY, JSON.stringify(a.slice(0, 6)));
    } catch (e) {}
  }
  function renderRecents(){
    const list = getRecents();
    recentsSec.hidden = !list.length || !!q.value.trim();
    chips.innerHTML = list.map(u => {
      const l = byUrl.get(u), m = modules[l.mod];
      return `<a class="chip tinted" style="--accent:${m.color}" href="${esc(l.url)}" target="_blank" rel="noopener" data-url="${esc(l.url)}">
        <span class="chip-ico"><i class="fas ${m.icon}" aria-hidden="true"></i></span>
        <span class="chip-name">${esc(l.name)}</span>
      </a>`;
    }).join('');
  }
  $('clearRecents').addEventListener('click', () => {
    try { localStorage.removeItem(RKEY); } catch (e) {}
    renderRecents();
  });
  function track(e){
    const a = e.target.closest('a[data-url]');
    if (!a) return;
    pushRecent(a.dataset.url);
    setTimeout(renderRecents, 150);
  }
  document.addEventListener('click', track);
  document.addEventListener('auxclick', e => { if (e.button === 1) track(e); });

  /* ---------- Búsqueda ---------- */
  function mark(text, tokens){
    const n = norm(text), ranges = [];
    tokens.forEach(t => {
      let i = n.indexOf(t);
      while (i !== -1) { ranges.push([i, i + t.length]); i = n.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (let k = 1; k < ranges.length; k++){
      const last = merged[merged.length - 1];
      if (ranges[k][0] <= last[1]) last[1] = Math.max(last[1], ranges[k][1]);
      else merged.push(ranges[k].slice());
    }
    let out = '', pos = 0;
    merged.forEach(([a, b]) => {
      out += esc(text.slice(pos, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>';
      pos = b;
    });
    return out + esc(text.slice(pos));
  }

  function runSearch(raw){
    const tokens = norm(raw).split(/\s+/).filter(Boolean);
    const hits = allLinks.filter(l => {
      const hay = norm(l.name + ' ' + modules[l.mod].title + ' ' + (l.group || ''));
      return tokens.every(t => hay.includes(t));
    });

    if (!hits.length){
      resultsMeta.textContent = 'Sin resultados';
      resultsBody.innerHTML = `
        <div class="empty">
          <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
          <strong>Sin resultados para «${esc(raw)}»</strong>
          Prueba con otra palabra o <button type="button" class="link-btn" id="emptyClear">borra la búsqueda</button>.
        </div>`;
      $('emptyClear').addEventListener('click', clearSearch);
      return;
    }

    resultsMeta.textContent = hits.length + (hits.length === 1 ? ' resultado' : ' resultados');
    const byMod = new Map();
    hits.forEach(l => { if (!byMod.has(l.mod)) byMod.set(l.mod, []); byMod.get(l.mod).push(l); });
    resultsBody.innerHTML = [...byMod.entries()].map(([mi, items]) => {
      const m = modules[mi];
      return `
        <section class="group tinted" style="--accent:${m.color}">
          <h3 class="group-title"><i class="fas ${m.icon}" aria-hidden="true"></i>${esc(m.title)}</h3>
          <div class="list">${items.map(l => rowHTML(l, mark(l.name, tokens), l.group)).join('')}</div>
        </section>`;
    }).join('');
  }

  function onQuery(){
    const v = q.value.trim();
    searchBox.classList.toggle('has-value', !!q.value);
    clearBtn.hidden = !q.value;
    if (!v){
      resultsSec.hidden = true;
      modulesSec.hidden = false;
      renderRecents();
    } else {
      modulesSec.hidden = true;
      recentsSec.hidden = true;
      resultsSec.hidden = false;
      runSearch(v);
    }
  }
  function clearSearch(){ q.value = ''; onQuery(); q.focus(); }

  q.addEventListener('input', onQuery);
  clearBtn.addEventListener('click', clearSearch);

  q.addEventListener('keydown', e => {
    const first = resultsSec.hidden ? null : resultsSec.querySelector('.row');
    if (e.key === 'ArrowDown' && first){ e.preventDefault(); first.focus(); }
    else if (e.key === 'Enter' && first){ e.preventDefault(); first.click(); }
  });
  resultsSec.addEventListener('keydown', e => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const rows = [...resultsSec.querySelectorAll('.row')];
    const i = rows.indexOf(document.activeElement);
    if (i === -1) return;
    e.preventDefault();
    if (e.key === 'ArrowDown') rows[Math.min(i + 1, rows.length - 1)].focus();
    else (i === 0 ? q : rows[i - 1]).focus();
  });

  /* ---------- Teclado global ---------- */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if (sheetOpen()) { closeSheet(); return; }
      if (document.activeElement === q && q.value) { q.value = ''; onQuery(); }
      return;
    }
    if (sheetOpen()) return;
    const el = document.activeElement;
    const typing = el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
    if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')){
      e.preventDefault();
      q.focus();
      q.select();
    }
  });

  /* ---------- Inicio ---------- */
  renderGrid();
  renderRecents();
  tick();
  setInterval(tick, 30000);
</script>
</body>
</html>
